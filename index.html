<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRIS</title>
<style>
*{box-sizing:border-box}
:root{--d:#0e5a6e;--t1:#1b3a6b;--t2:#3c6aa8}
:root[data-t=julien]{--d:#3d3a55;--t1:#4a2f6b;--t2:#8a6fb0}
:root[data-t=iris]{--d:#2b0a0a;--t1:#6b1111;--t2:#c13a3a}
html,body{height:100%;margin:0;overflow:hidden;background:#000;font:14px Tahoma,Verdana,sans-serif;color:#151515;user-select:none}
input{user-select:text;font:inherit}
.panel{background:#c9c9c4;box-shadow:inset -1px -1px #333,inset 1px 1px #fff,inset -2px -2px #888,inset 2px 2px #e6e6e2}
button{font:inherit;padding:6px 16px;background:#c9c9c4;border:0;cursor:pointer;box-shadow:inset -1px -1px #333,inset 1px 1px #fff,inset -2px -2px #888,inset 2px 2px #e6e6e2}
button:active{box-shadow:inset 1px 1px #333,inset -1px -1px #fff}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #1b3a6b;outline-offset:1px}
input{padding:6px;border:0;background:#fff;box-shadow:inset 1px 1px #555,inset -1px -1px #ddd;width:100%}
input:disabled{background:#ddd}
h1{margin:0 0 4px;font:700 30px "Trebuchet MS",sans-serif;letter-spacing:3px;color:var(--t1)}
label{display:block;margin:10px 0 3px;font-weight:700}
a{color:#1b3a6b;text-decoration:underline;cursor:pointer}
.err{color:#9c1c14;margin-top:10px;min-height:38px}.okm{color:#1f6b2a}
#splash,#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#splash{background:#000;z-index:100000}
#login{background:radial-gradient(circle at 30% 20%,var(--t2),#0a1520 70%);display:none}
#splash .panel,#login .panel{width:390px;padding:24px}
.own{font-size:12px;letter-spacing:3px;color:#555}
#lo{font:700 24px "Trebuchet MS",sans-serif;color:var(--t1);text-transform:uppercase;margin:2px 0 12px}
#fh{display:none;margin-top:10px}
#desk{position:fixed;inset:0;background:var(--d);display:none;transition:background .6s}
#desk.gl{animation:gl 1.2s steps(1) infinite}
@keyframes gl{
0%{transform:translate(0);filter:none}
10%{transform:translate(-18px,3px) skewX(4deg);filter:drop-shadow(6px 0 #f00) drop-shadow(-6px 0 #0ff)}
22%{transform:translate(0);filter:contrast(1.8)}
34%{transform:translate(22px,-5px) scaleY(1.03);filter:hue-rotate(120deg) drop-shadow(-5px 0 #0f0)}
48%{transform:translate(-8px,0);filter:none}
62%{transform:translate(14px,6px) skewX(-5deg);filter:drop-shadow(5px 0 #f0f) saturate(3)}
78%{transform:translate(0);filter:brightness(.6)}
90%{transform:translate(-26px,-3px);filter:drop-shadow(-7px 0 #f00) drop-shadow(7px 0 #0ff)}
100%{transform:translate(0)}}
#top{position:absolute;left:0;right:0;top:0;height:38px;display:flex;align-items:center;gap:10px;padding:0 14px;z-index:9000;letter-spacing:1px}
#top span{font-size:12px;letter-spacing:3px;color:#555}
#top b{text-transform:uppercase;color:var(--t1);font-size:16px}
.ico{position:absolute;left:24px;width:110px;text-align:center;color:#fff;cursor:pointer;text-shadow:1px 1px 2px #000;padding:4px}
.ico b{display:block;font-size:36px;font-weight:400}.ico.lock{opacity:.55}
#bar{position:absolute;left:0;right:0;bottom:0;height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:9000}
#tm{font:700 16px "Courier New",monospace;padding:3px 10px;background:#fff;box-shadow:inset 1px 1px #555}#tm.low{color:#b3261e}
.win{position:absolute;width:420px;max-width:96vw}
.tb{display:flex;justify-content:space-between;align-items:center;padding:5px 7px;margin:3px;background:linear-gradient(90deg,var(--t1),var(--t2));color:#fff;font-weight:700;cursor:move;touch-action:none}
.x{padding:0 8px;line-height:18px}.bd{padding:14px 16px 16px}.bd p{margin:0 0 10px;line-height:1.45}
.row{display:flex;gap:8px}.row button{white-space:nowrap}
.msg{padding:6px 8px;margin-bottom:6px;background:#fff;box-shadow:inset 1px 1px #555}
.chips{display:flex;gap:10px;min-height:38px;margin-bottom:12px;flex-wrap:wrap}
.chip{display:inline-block;width:32px;height:32px;margin:2px;border:2px solid #fff;box-shadow:0 0 0 1px #333;cursor:pointer}.chip.sel{outline:3px solid #ffd400;outline-offset:2px}
.fold{display:flex;gap:10px;margin-bottom:12px}
.fd{flex:1;min-height:110px;text-align:center;padding:8px;background:#e9e4c4;box-shadow:inset 1px 1px #555;cursor:pointer}.sy{font-size:34px}
.sqc{display:inline-block;width:46px;height:46px;margin:4px;opacity:.22;border:2px solid #fff;box-shadow:0 0 0 1px #333;transition:opacity .08s}
.sqc.on{opacity:1;outline:3px solid #fff}
.gr{display:grid;grid-template-columns:22px repeat(5,38px);gap:3px;justify-content:center;margin:6px 0 12px}
.gr b{display:flex;align-items:center;justify-content:center;font-size:12px;color:#333;min-height:22px}
.gr i{height:38px;background:#e9e9e4;box-shadow:inset 1px 1px #888}.gr i.on{background:#1b3a6b}
#lock,#crash,#over{position:fixed;inset:0;display:none}
#lock{z-index:99500;background:rgba(110,0,0,.94);color:#fff;align-items:center;justify-content:center;text-align:center;font:700 40px "Trebuchet MS",sans-serif}
#lock small{display:block;margin-top:14px;font-size:20px;font-weight:400}
#crash{z-index:99000;overflow:hidden}
#crash.on{background:rgba(0,0,0,.62);animation:fk 2.2s steps(1) infinite}
#crash.on::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);pointer-events:none}
#crash.blk{background:#000}
@keyframes fk{0%{opacity:1}30%{opacity:.88}34%{opacity:1}70%{opacity:.92}74%{opacity:1}}
#cl{position:absolute;inset:0;padding:12px 18px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;font:13px/1.3 "Courier New",monospace;color:#8f8;text-shadow:0 0 5px #2f2;white-space:pre}
#cl .r{color:#f66;text-shadow:0 0 5px #f22}
#crash i{position:absolute;left:0;width:100%;mix-blend-mode:screen;opacity:.35;animation:fl .9s steps(4) infinite}
@keyframes fl{0%,100%{transform:translateX(0)}25%{transform:translateX(-40px)}50%{transform:translateX(50px)}75%{transform:translateX(-15px)}}
#fatal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:26px 40px;background:#400;border:3px solid #f55;color:#fff;font:700 30px "Courier New",monospace;text-align:center;box-shadow:0 0 40px #f00}
#fatal small{display:block;margin-top:10px;font-size:16px;font-weight:400;color:#fbb}
.off{position:absolute;left:0;right:0;top:50%;background:#cde;height:100%;transform:translateY(-50%);animation:off .7s ease-in forwards}
@keyframes off{0%{height:100%;opacity:.85}55%{height:3px;opacity:1}85%{height:3px;left:45%;right:45%}100%{height:2px;left:50%;right:50%;opacity:0}}
#bpre{position:absolute;left:24px;top:24px;margin:0;font:16px/1.7 "Courier New",monospace;color:#ccc;white-space:pre}
/* deuxième plantage : prise de contrôle d'IRIS */
#desk.gl2{animation:gl2 .9s steps(1) infinite}
@keyframes gl2{0%{transform:scale(1);filter:none}15%{transform:scale(1.05) rotate(-.6deg);filter:invert(1) hue-rotate(180deg)}30%{transform:scale(.97);filter:contrast(2) saturate(4)}45%{transform:scale(1.08) rotate(.8deg);filter:grayscale(1) brightness(1.6)}60%{transform:translate(0,12px);filter:drop-shadow(0 0 14px #f00) hue-rotate(300deg)}75%{transform:scale(1.03) skewY(2deg);filter:invert(1)}100%{transform:scale(1);filter:none}}
#crash.red{background:rgba(30,0,0,.94)}
#crash.red::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 1px,transparent 1px 3px);pointer-events:none}
#cl2{position:absolute;left:0;top:0;bottom:0;width:62%;padding:20px 26px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;font:15px/1.6 "Courier New",monospace;color:#f66;text-shadow:0 0 6px #f00;white-space:pre}
#cl2 .k{color:#fff;font-weight:700}
#eye{position:absolute;right:12%;top:50%;width:260px;height:260px;margin-top:-130px;border-radius:50%;background:radial-gradient(circle,#000 0 16%,#e22 17% 30%,#600 31% 60%,transparent 62%);box-shadow:0 0 80px #f00;opacity:0;transition:opacity 1.5s;animation:eye 1.2s ease-in-out infinite}
@keyframes eye{0%,100%{transform:scale(.92)}50%{transform:scale(1.08)}}
#big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#f22;font:700 54px/1.3 "Courier New",monospace;letter-spacing:6px;text-shadow:0 0 30px #f00;animation:bg .35s steps(1) infinite}
@keyframes bg{0%,100%{opacity:1}50%{opacity:.55}}
/* mode stress : protocole IRIS actif */
#vig{position:fixed;inset:0;pointer-events:none;z-index:9600;display:none;border:7px solid #c40000;box-shadow:inset 0 0 130px rgba(255,0,0,.55)}
body.stress #vig{display:block;animation:vp 1.1s ease-in-out infinite}
body.stress2 #vig{border-width:11px;animation-duration:.6s}
@keyframes vp{0%,100%{opacity:1}50%{opacity:.35}}
#warn{position:absolute;left:0;right:0;top:38px;height:24px;display:none;align-items:center;justify-content:center;background:#a00;color:#fff;font:700 13px "Courier New",monospace;letter-spacing:3px;z-index:9100;animation:wb 1s steps(1) infinite}
body.stress #warn{display:flex}
@keyframes wb{0%,100%{background:#a00}50%{background:#400}}
body.stress #tm{color:#c00;animation:tb .5s steps(1) infinite}
@keyframes tb{50%{background:#fcc}}
#an{display:none;align-items:center;gap:8px;font:700 12px "Courier New",monospace;color:#900}
body.stress #an{display:flex}
.pb{display:inline-block;width:170px;height:12px;background:#fff;box-shadow:inset 1px 1px #555}.pb i{display:block;height:100%;width:0;background:#c00;transition:width .8s}
#toast{position:absolute;right:14px;bottom:50px;width:330px;z-index:9500;display:none;padding:10px 12px;background:#fff0f0;border:2px solid #c00;color:#900;font-weight:700}
#over{z-index:99800;background:rgba(10,20,30,.94);color:#fff;text-align:center;align-items:center;justify-content:center;font:700 28px "Trebuchet MS",sans-serif;padding:40px;line-height:1.4}
</style></head><body>

<div id="splash"><div class="panel"><h1>IRIS</h1><p>Poste de contrôle. L'affichage doit passer en plein écran.</p><button id="go">Démarrer le poste</button></div></div>
<div id="login"><div class="panel"><div class="own">SESSION DE</div><div id="lo"></div><p id="ls"></p>
  <label for="u">Identifiant</label><input id="u" autocomplete="off">
  <label for="p">Mot de passe</label><input id="p" type="password" autocomplete="off">
  <div class="err" id="le"></div><button id="lb">Ouvrir la session</button>
  <div style="margin-top:12px"><a id="fg" href="#">Mot de passe oublié ?</a></div><div id="fh" class="msg"></div></div></div>
<div id="desk"><div id="top" class="panel"><span>SESSION DE</span><b id="sn"></b></div><div id="warn"></div><div id="toast"></div><div id="bar" class="panel"><b id="bl">IRIS · Poste de contrôle</b><span id="an">ANNULATION D'IRIS <span class="pb"><i id="pbf"></i></span> <b id="pct">0%</b></span><span>Temps restant : <span id="tm">--:--</span></span></div></div><div id="vig"></div>
<div id="lock"></div><div id="crash"></div><div id="over"></div>

<script>
/* ===== CONTENU À MODIFIER =====
   Réponses stockées en hash. Console (F12) : H("réponse") donne le hash, reset() remet tout à zéro.
   Réponses actuelles :
   dr.valek / IRIS-0731 · julien.m / carnet12 · CADB · 23769 · 4AK9E3 (affiché 7DNCH6) · 3323 · 8366 */
function grid(rows){let h='<div class="gr"><span></span>'+'ABCDE'.split('').map(c=>`<b>${c}</b>`).join('');
  rows.forEach((r,i)=>{h+=`<b>${i+1}</b>`+r.split('').map(c=>`<i class="${c==='#'?'on':''}"></i>`).join('')});return h+'</div>'}
const DATA={
 duree:50*60,
 /* plaques : couleur → dossier. sol[k] = numéro du dossier (0,1,2) de la plaque k, dans l'ordre de cols */
 plaques:{cols:[["bleue","#1e5bd8"],["rouge","#d12a2a"],["jaune","#e8c21a"],["violette","#7a35b8"],["verte","#2a9d4a"],["noire","#161616"]],folders:["🐕","🌲","⭐"],sol:[0,1,2,1,0,2]},
 video:{src:"julien.mp4",texte:"« Si vous voyez ceci, vous êtes pris au piège. IRIS n'a jamais été abandonné. Le mode protection isole les intrus pour en faire des cobayes. Valek veut devenir le maître : contrôler les esprits par la pensée. Je ne peux pas vous aider directement, mais j'ai tout noté. Arrêtez IRIS, et je vous dirai comment sortir. Parlez-vous : IRIS se nourrit de l'isolement. »"},
 cle:"[INDICE DE LA CLÉ À COMPLÉTER]",
 fin(){return `<div><div style="font-size:34px;letter-spacing:3px;margin-bottom:18px">PROTOCOLE IRIS INTERROMPU</div><div style="font-weight:400;font-size:20px;opacity:.85;margin-bottom:26px">IRIS s'éteint. Les liaisons neuronales sont coupées.</div><div style="font-weight:400;font-size:22px;max-width:900px;margin:0 auto">Message de Julien :<br>« Vous avez réussi. Mais les verrous manuels ne dépendent pas d'IRIS. Pour libérer les opérateurs, il faut la clé : <b>${this.cle}</b>. »</div></div>`},
 phases:[
  {nom:"Dr Valek",theme:"valek",login:{u:"1d8lqti",p:"l0o02p",hint:"L'identifiant et le mot de passe se trouvent sur le badge d'accès du docteur Valek."},
   boot:["IRIS BIOS v2.3 — Laboratoire Valek","Vérification mémoire .......... OK","Session « dr.valek » .......... INTROUVABLE","Chargement d'une session de secours ..."],
   tasks:[{ico:"🗂️",nom:"Dossier n°1",type:"plaques",txt:"Dossier protégé. Rangez chaque plaque dans le dossier qui porte son symbole. Une erreur bloque l'accès 30 secondes.",
     reveal:{t:"Lettre du Dr Valek",h:"<p><i>Objet : projet IRIS</i></p><p>Le projet IRIS est officiellement abandonné faute de financement. Le protocole s'éteindra de lui-même. Aucune intervention n'est nécessaire.</p><p>Dr Valek</p>"}}],
   after:"crash",delay:14000},
  {nom:"Julien",theme:"julien",login:{u:"4ctlw9",p:"1uf7b1l",hint:"L'identifiant et le mot de passe de Julien sont notés dans son carnet."},
   boot:["IRIS BIOS v2.3 — Laboratoire Valek","Mode protection .......... SUSPENDU","PROTOCOLE IRIS .......... EN MARCHE","Liaison neuronale .......... ÉTABLIE"],
   tasks:[
    {ico:"📩",nom:"Messages de Julien",txt:"Quatre messages sans date. L'équipe dehors a le calendrier du labo : donnez l'ordre chronologique.",
     extra:'<div class="msg"><b>A</b> « Valek a coupé le budget. »</div><div class="msg"><b>B</b> « Les premiers cobayes arrivent. »</div><div class="msg"><b>C</b> « IRIS est enfin prêt. »</div><div class="msg"><b>D</b> « Je garde des copies de tout. »</div>',ph:"4 lettres, ex. ABCD",h:"yj0129"},
    {ico:"🔒",nom:"Dossier privé",seq:["rouge","noire","bleue","verte","jaune"],txt:"Julien a verrouillé ce dossier avec une séquence lumineuse. Lancez-la, notez l'ordre des couleurs et donnez-le à l'équipe dehors : la table « code couleur de Julien » est dans le labo. Le code fait 5 chiffres.",ph:"Code (5 chiffres)",h:"1wxbgc"}],
   after:"video",delay:2500},
  {nom:"IRIS (protocole actif)",theme:"iris",nologin:true,
   tasks:[
    {ico:"📡",nom:"Relais radio",txt:"La radio est brouillée. IRIS a chiffré le mot de passe de sortie : chaque caractère est décalé. L'équipe dehors a le disque de chiffrement.",extra:'<div class="msg" style="font:700 26px Courier New;letter-spacing:4px;text-align:center">7DNCH6</div>',ph:"Mot de passe déchiffré (6 caractères)",h:"1ov685w"},
    {ico:"🧬",nom:"Empreinte IRIS",txt:"IRIS demande une reconnaissance de motif. Décrivez le motif ci-dessous à l'équipe dehors (colonne + ligne, par exemple « B3 »). Ils ont les cartes d'empreintes : une seule correspond exactement. Entrez le code inscrit sur cette carte.",extra:grid([".....", "##...", "....#", "####.", "#.#.#"]),ph:"Code (4 chiffres)",h:"yhx7ac"}],
   after:"next",delay:3000},
  {nom:"Dr Valek (administrateur)",theme:"valek",auto:"dr.valek",
   tasks:[{ico:"⛔",nom:"Désactiver IRIS",arm:20,txt:"Administrateur : arrêt du protocole. Le code d'arrêt a 4 chiffres, un par ligne. La valeur de chaque symbole se trouve dans la Table IRIS, dans le labo. Armez le verrou seulement quand le code est prêt.",
     extra:'<div class="msg" style="font:700 22px Courier New;line-height:1.7">1) ⭐ + 🐕<br>2) 🌲 − ⭐<br>3) 🐕 × 🌙<br>4) 🌲 − 🌙</div>',ph:"Code d'arrêt (4 chiffres)",h:"yi151q"}],
   after:"end",delay:1500}
 ]};

/* ===== OUTILS ===== */
const $=id=>document.getElementById(id);
const H=s=>{s=s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');let h=5381;for(const c of s)h=((h*33)^c.charCodeAt(0))>>>0;return h.toString(36)};
let S={ph:0,lg:false,n:0,t:DATA.duree,st:false,ended:false};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('iris')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('iris',JSON.stringify(S))}catch(e){}};
const PH=()=>DATA.phases[S.ph];
let ac;
function A(){try{ac=ac||new AudioContext();if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}
function tone(f,d=.15,ty='square',v=.06,at=0){try{const c=A();if(!c)return;const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+at;o.type=ty;o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.start(s);o.stop(s+d)}catch(e){}}
const sOk=()=>{tone(660,.12,'sine',.1);tone(880,.22,'sine',.1,.12)},sBad=()=>tone(160,.4,'sawtooth',.07);
function burstNoise(at,d,v,f,q,type){try{const c=A();if(!c)return;const n=Math.max(1,Math.floor(c.sampleRate*d)),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
  const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime+at;
  s.buffer=b;fl.type=type||'bandpass';fl.frequency.value=f;fl.Q.value=q||1;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl);fl.connect(g);g.connect(c.destination);s.start(t)}catch(e){}}
function crashSound(){try{const c=A();if(!c)return;const t0=c.currentTime;
  for(let k=0;k<9;k++){const t=Math.random()*1.8;burstNoise(t,.03+Math.random()*.1,.28,1500+Math.random()*3500,.8);tone(40+Math.random()*60,.12,'sine',.18,t)}
  const o=c.createOscillator(),lp=c.createBiquadFilter(),g=c.createGain();o.type='sawtooth';lp.type='lowpass';lp.frequency.value=700;
  o.frequency.setValueAtTime(55,t0+1.8);o.frequency.exponentialRampToValueAtTime(240,t0+7.2);
  g.gain.setValueAtTime(.0001,t0+1.8);g.gain.exponentialRampToValueAtTime(.16,t0+6);g.gain.setValueAtTime(.16,t0+7.2);g.gain.exponentialRampToValueAtTime(.0001,t0+7.3);
  o.connect(lp);lp.connect(g);g.connect(c.destination);o.start(t0+1.8);o.stop(t0+7.4);
  for(let t=1.8;t<7.2;t+=.06+Math.random()*.1){if(Math.random()<.6)tone(200+Math.random()*2600,.03+Math.random()*.05,Math.random()<.5?'square':'sawtooth',.05,t);if(Math.random()<.45)burstNoise(t,.02+Math.random()*.08,.22,500+Math.random()*4000,.6)}
  const o2=c.createOscillator(),g2=c.createGain();o2.type='sine';o2.frequency.setValueAtTime(520,t0+7.3);o2.frequency.exponentialRampToValueAtTime(24,t0+8);
  g2.gain.setValueAtTime(.3,t0+7.3);g2.gain.exponentialRampToValueAtTime(.0001,t0+8.1);o2.connect(g2);g2.connect(c.destination);o2.start(t0+7.3);o2.stop(t0+8.2);
  burstNoise(7.3,.5,.3,400,.5,'lowpass')}catch(e){}}
document.addEventListener('contextmenu',e=>e.preventDefault());
window.reset=()=>{localStorage.removeItem('iris');location.reload()};

/* ===== PLEIN ÉCRAN ===== */
$('go').onclick=()=>{const d=document.documentElement;try{Promise.resolve((d.requestFullscreen||d.webkitRequestFullscreen).call(d)).then(()=>{try{navigator.keyboard.lock(['Escape'])}catch(e){}}).catch(()=>{})}catch(e){}
  tone(440,.1,'sine',.05);$('splash').style.display='none'};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){$('splash').style.display='flex'}});

/* ===== FENÊTRES ===== */
let z=10;
function openWin(id,titre,html){
  let w=$('w-'+id);if(w){w.style.zIndex=++z;return w}
  w=document.createElement('div');w.id='w-'+id;w.className='win panel';
  w.style.cssText=`left:${160+Math.random()*160}px;top:${(document.body.classList.contains('stress')?84:56)+Math.random()*70}px;z-index:${++z}`;

/* ===== SESSIONS ===== */

  setStress(S.ended?0:S.ph>=3?2:S.ph>=2?1:0);
  const p=PH();document.documentElement.dataset.t=p.theme;$('sn').textContent=p.nom;$('lo').textContent=p.nom;
  document.querySelectorAll('.win').forEach(w=>w.remove());
  if(S.ended){showDesk();over(DATA.fin());return}
  if(p.nologin||S.lg){S.lg=true;showDesk();if(S.n>=p.tasks.length)phaseEnd()}
  else{$('desk').style.display='none';$('login').style.display='flex';$('u').value='';$('p').value='';$('le').textContent='';$('fh').style.display='none';
    $('fg').parentNode.style.display=p.auto?'none':'';$('lb').style.display=p.auto?'none':'';
    if(p.auto){$('ls').textContent='Reconnexion automatique par IRIS…';$('u').value=p.auto;$('p').value='••••••••';setTimeout(()=>{S.lg=true;save();sOk();render()},4500)}
    else $('ls').textContent='Session verrouillée.'}
}
function showDesk(){$('login').style.display='none';$('desk').style.display='block';S.st=true;icons();clock();prog()}
function tryLogin(){const l=PH().login;if(!l)return;
  if(H($('u').value)===l.u&&H($('p').value)===l.p){sOk();S.lg=true;save();render()}
  else{sBad();$('le').textContent='Identifiant et/ou mot de passe incorrect.'}}
$('lb').onclick=tryLogin;$('login').onkeydown=e=>{if(e.key==='Enter')tryLogin()};
$('fg').onclick=e=>{e.preventDefault();const l=PH().login,f=$('fh');f.textContent=l?l.hint:'';f.style.display='block'};

function icons(){document.querySelectorAll('.ico').forEach(n=>n.remove());
  PH().tasks.forEach((e,k)=>{const d=document.createElement('div'),l=k>S.n;d.className='ico'+(l?' lock':'');d.style.top=(document.body.classList.contains('stress')?76:52)+k*96+'px';
    d.innerHTML=`<b>${l?'🔒':e.ico}</b>${e.nom}${k<S.n?' ✔':''}`;d.onclick=()=>openTask(k);$('desk').appendChild(d)})}
function openTask(i){
  const p=PH(),e=p.tasks[i];
  if(i>S.n){sBad();openWin('lk','Accès refusé',`<p>Verrouillé. Terminez d'abord « ${p.tasks[S.n].nom} ».</p>`);return}
  const w=openWin('t'+i,e.nom,'');if(w.dataset.b)return;w.dataset.b=1;
  const bd=w.querySelector('.bd');e.type==='plaques'?plaques(i,e,bd):quest(i,e,w,bd);
}
function done(i,e){sOk();S.n=Math.max(S.n,i+1);save();icons();prog();if(document.body.classList.contains('stress'))react();if(e.reveal)openWin('rv',e.reveal.t,e.reveal.h);if(S.n>=PH().tasks.length)phaseEnd()}
function seqInit(bd,e){
  const cols=DATA.plaques.cols,box=bd.querySelector('#sq'),btn=bd.querySelector('#pl');
  box.innerHTML=cols.map(c=>`<span class="sqc" style="background:${c[1]}"></span>`).join('');
  const cells=box.children;
  btn.onclick=()=>{btn.disabled=true;
    e.seq.forEach((nm,k)=>{const idx=cols.findIndex(c=>c[0]===nm);
      setTimeout(()=>{cells[idx].classList.add('on');tone(300+idx*110,.5,'sine',.1)},500+k*1000);
      setTimeout(()=>cells[idx].classList.remove('on'),500+k*1000+700)});
    setTimeout(()=>{btn.disabled=false},500+e.seq.length*1000+200)}}
function quest(i,e,w,bd){
  bd.innerHTML=`<p>${e.txt}</p>${e.extra||''}${e.seq?'<div id="sq" style="text-align:center;margin:6px 0"></div><div class="row" style="margin-bottom:8px"><button id="pl">▶ Lancer la séquence</button></div>':''}${e.arm?`<div class="row" style="margin-bottom:8px"><button id="ar">Armer (${e.arm} s)</button></div>`:''}<div class="row"><input id="in" placeholder="${e.ph}" autocomplete="off"${e.arm?' disabled':''}><button id="bt">Valider</button></div><div class="err" id="fb"></div>`;
  if(e.seq)seqInit(bd,e);
  const f=bd.querySelector('#fb'),inp=bd.querySelector('#in');
  const go=()=>{
    if(inp.disabled){sBad();f.className='err';f.textContent="Non armé. Armez d'abord, puis saisissez le code avant la fin du compte à rebours.";return}
    if(H(inp.value)===e.h){clearInterval(w.k);f.className='err okm';f.textContent='Validé.';done(i,e)}
    else{sBad();f.className='err';f.textContent="Réponse refusée. Redemandez l'information à l'équipe sur le terrain et vérifiez chaque caractère."}};
  bd.querySelector('#bt').onclick=go;inp.onkeydown=ev=>{if(ev.key==='Enter')go()};
  if(e.arm)bd.querySelector('#ar').onclick=()=>{let n=e.arm;inp.disabled=false;inp.focus();f.className='err';f.textContent=`Armé : ${n} s`;clearInterval(w.k);
    w.k=setInterval(()=>{n--;f.textContent=`Armé : ${n} s`;if(n<=0){clearInterval(w.k);inp.disabled=true;sBad();f.textContent="Désarmé : temps écoulé. Réarmez quand l'équipe est prête."}},1000)};
  if(i<S.n){f.className='err okm';f.textContent='Déjà validé.'}
}
function lockErr(){const l=$('lock');let n=30;sBad();l.style.display='flex';const f=()=>l.innerHTML=`<div>ERREUR<small>Classement incorrect. Accès bloqué pendant ${n} s.</small></div>`;f();
  const k=setInterval(()=>{n--;f();if(n<=0){clearInterval(k);l.style.display='none'}},1000)}
function plaques(i,e,bd){
  const c=DATA.plaques,as=Array(c.cols.length).fill(-1);let sel=-1;
  const chip=k=>`<span class="chip${sel===k?' sel':''}" data-k="${k}" style="background:${c.cols[k][1]}" role="button" aria-label="plaque ${c.cols[k][0]}"></span>`;
  const draw=()=>{bd.innerHTML=`<p>${e.txt}</p><div class="chips">${as.map((a,k)=>a<0?chip(k):'').join('')}</div><div class="fold">${c.folders.map((s,f)=>`<div class="fd" data-f="${f}"><div class="sy">${s}</div>${as.map((a,k)=>a===f?chip(k):'').join('')}</div>`).join('')}</div><div class="row"><button id="vp"${as.includes(-1)?' disabled':''}>Valider le classement</button></div><div class="err" id="fb"></div>`;
    bd.querySelectorAll('.chip').forEach(n=>n.onclick=ev=>{ev.stopPropagation();sel=+n.dataset.k;draw()});
    bd.querySelectorAll('.fd').forEach(n=>n.onclick=()=>{if(sel>=0){as[sel]=+n.dataset.f;sel=-1;draw()}});
    bd.querySelector('#vp').onclick=()=>{if(as.every((a,k)=>a===c.sol[k])){bd.querySelector('#fb').className='err okm';bd.querySelector('#fb').textContent='Classement validé.';done(i,e)}else lockErr()}};
  draw();if(i<S.n){bd.querySelector('#fb').className='err okm';bd.querySelector('#fb').textContent='Déjà validé.'}
}

/* ===== TRANSITIONS ===== */
function phaseEnd(){const p=PH();if(phaseEnd.b)return;phaseEnd.b=1;setTimeout(()=>{
  if(p.after==='end'){S.ended=true;save();setStress(0);sOk();over(DATA.fin())}
  else if(p.after==='next')next();
  else if(p.after==='video')video(()=>crash2(next,p.boot));
  else crash(next,p.boot)},p.delay||2500)}
function next(){S.ph++;S.lg=false;S.n=0;phaseEnd.b=0;save();render()}
function over(x){const o=$('over');o.innerHTML=x;o.style.display='flex'}
function video(cb){
  const w=openWin('vid','Julien : enregistrement privé',`<video id="vd" src="${DATA.video.src}" controls autoplay style="width:100%;background:#000"></video><div id="tr" class="msg" style="display:none">${DATA.video.texte}</div><div class="row" style="margin-top:8px"><button id="vc" style="display:none">Fermer l'enregistrement</button></div>`);

/* ===== PLANTAGE RÉALISTE ===== */

  setTimeout(()=>{c.style.display='none';c.className='';d.classList.remove('gl');d.style.display='none';cb()},8200+boot.length*650+1000);

  o.connect(lp);lp.connect(g);g.connect(c.destination);o.start(t0+2.4);o.stop(t0+9.5);

  s.connect(sl);sl.connect(sg);sg.connect(c.destination);s.start(t0+2.8);s.stop(t0+9.5);
  for(let t=2.6;t<9.2;t+=.07+Math.random()*.12){if(Math.random()<.5)tone(300+Math.random()*2200,.03,'square',.04,t)}
  const b=c.createOscillator(),bg=c.createGain();b.type='sine';b.frequency.setValueAtTime(70,t0+9.45);b.frequency.exponentialRampToValueAtTime(24,t0+10.8);

  const a=c.createOscillator(),ag=c.createGain();a.type='square';for(let k=0;k<12;k++)a.frequency.setValueAtTime(k%2?880:440,t0+10.4+k*.18);
  ag.gain.setValueAtTime(.09,t0+10.4);ag.gain.setValueAtTime(.09,t0+12.5);ag.gain.exponentialRampToValueAtTime(.0001,t0+12.7);a.connect(ag);ag.connect(c.destination);a.start(t0+10.4);a.stop(t0+12.8)}catch(e){}}

/* ===== MODE STRESS : le protocole est actif, ils sont en train d'annuler IRIS ===== */
const ALERTS=[
 ["⚠ Résistance détectée dans le secteur 4","IRIS : « Pourquoi résister ? »","Liaison neuronale : 63 %","Intrusion détectée : opérateurs","IRIS réécrit les accès…","Surcharge du relais radio"],
 ["⚠ ARRÊT DU PROTOCOLE EN COURS","IRIS : « Arrêtez. Je peux vous protéger. »","Contre-mesures activées","Température du noyau : critique","Dr Valek : « Ne faites pas ça. »","Liaison neuronale instable"]];
const WARN=["⚠  PROTOCOLE IRIS ACTIF · LIAISON NEURONALE EN COURS  ⚠","⚠  ARRÊT D'IRIS DÉTECTÉ · CONTRE-MESURES ACTIVES  ⚠"];
let stressIv=[];
function sirenSound(d){try{const c=A();if(!c)return;const o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter(),t=c.currentTime;
  o.type='sawtooth';lp.type='lowpass';lp.frequency.value=1600;
  for(let k=0;k<d/.45;k++)o.frequency.setValueAtTime(k%2?780:520,t+k*.45);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09,t+.05);g.gain.setValueAtTime(.09,t+d-.1);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(lp);lp.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
function microGlitch(){const d=$('desk'),c=$('crash');if(c.style.display==='block'||d.style.display==='none')return;d.classList.add('gl');burstNoise(0,.25,.25,1800,.8);setTimeout(()=>d.classList.remove('gl'),320)}
function toast(x){const t=$('toast');if(!t)return;t.textContent=x;t.style.display='block';tone(880,.1,'square',.07);tone(660,.1,'square',.07,.14);clearTimeout(toast.k);toast.k=setTimeout(()=>t.style.display='none',6000)}
function react(){sirenSound(1);toast("⚠ Tentative d'arrêt détectée : IRIS réagit");microGlitch()}
function prog(){const p=PH();if(!p)return;const pc=S.ended?100:S.ph===2?Math.round(S.n/p.tasks.length*55):S.ph>=3?55+Math.round(S.n/p.tasks.length*45):0;$('pbf').style.width=pc+'%';$('pct').textContent=pc+'%'}
function setStress(l){
  document.body.classList.toggle('stress',l>0);document.body.classList.toggle('stress2',l>1);
  stressIv.forEach(clearInterval);stressIv=[];
  $('bl').textContent=l>0?'⚠ IRIS · PROTOCOLE ACTIF':'IRIS · Poste de contrôle';
  if(l<1)return;
  $('warn').textContent=WARN[l-1];
  const on=()=>S.st&&!S.ended;
  stressIv.push(setInterval(()=>{if(on()){tone(58,.16,'sine',.16);tone(46,.2,'sine',.14,.18)}},l>1?650:1100));
  stressIv.push(setInterval(()=>{if(on())sirenSound(l>1?1.8:1.2)},l>1?9000:14000));
  stressIv.push(setInterval(()=>{if(on())toast(ALERTS[l-1][Math.random()*ALERTS[l-1].length|0])},l>1?16000:24000));
  stressIv.push(setInterval(()=>{if(on())microGlitch()},l>1?9000:15000));
}

/* ===== TIMER ===== */
function clock(){const t=Math.max(0,S.t),el=$('tm');el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');el.className=t<300?'low':''}

render();
